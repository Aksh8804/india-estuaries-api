<!DOCTYPE html>
<html>
<head>
<title>Admin - Users</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.badge-role{
    font-size:12px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
<span class="navbar-brand">Admin Dashboard</span>

<button class="btn btn-danger" onclick="logout()">Logout</button>
</div>
</nav>


<div class="container mt-4">

<h3>Users</h3>

<table class="table table-bordered table-striped mt-3" id="usersTable">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Username</th>
<th>Email</th>
<th>Role</th>
<th>Verified</th>
<th>Actions</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


<script>

const API = "http://127.0.0.1:8000"
const token = localStorage.getItem("access_token")

if(!token){
    alert("Please login first")
    window.location.href="login.html"
}


async function loadUsers(){

    const response = await fetch(`${API}/admin/users`,{
        headers:{
            "Authorization":`Bearer ${token}`
        }
    })

    if(response.status===401 || response.status===403){

        alert("Session expired. Please login again.")

        localStorage.removeItem("access_token")

        window.location.href="login.html"

        return
    }

    const users = await response.json()

    const tbody = document.querySelector("#usersTable tbody")

    tbody.innerHTML=""

    users.forEach(user=>{

        const row=document.createElement("tr")

        row.innerHTML=`

        <td>${user.id}</td>
        <td>${user.username}</td>
        <td>${user.email}</td>
        <td>${user.role}</td>
        <td>${user.is_verified}</td>

        <td>

        <button class="btn btn-success btn-sm" onclick="verifyUser(${user.id})">
        Verify
        </button>

        <button class="btn btn-primary btn-sm" onclick="promoteUser(${user.id})">
        Promote
        </button>

        </td>

        `

        tbody.appendChild(row)

    })

}



async function verifyUser(user_id){

    await fetch(`${API}/verify-user?user_id=${user_id}`,{
        method:"POST",
        headers:{
            "Authorization":`Bearer ${token}`
        }
    })

    loadUsers()

}



async function promoteUser(user_id){

    const role=prompt("Enter role (viewer/editor/admin):")

    if(!role) return

    await fetch(`${API}/promote-user`,{

        method:"POST",

        headers:{
            "Authorization":`Bearer ${token}`,
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            user_id:user_id,
            new_role:role
        })

    })

    loadUsers()

}


function logout(){

    localStorage.removeItem("access_token")

    window.location.href="login.html"

}


window.onload=loadUsers

</script>

</body>
</html>
