<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estuary Ranking - India Estuary Microplastic Viewer</title>

<!-- PDF LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6fa;}
header{background:#001a3d;color:white;padding:15px;text-align:center;}
.container{padding:20px;}
button{padding:8px 14px;margin:5px;cursor:pointer;border:none;background:#023;color:white;border-radius:4px;}
button:hover{background:#035;}
select{padding:8px;margin:5px;border-radius:4px;border:1px solid #ccc;}
table{border-collapse:collapse;width:100%;margin-top:10px;margin-bottom:30px;background:white;}
th,td{border:1px solid #ccc;padding:6px 10px;text-align:center;}
th{background:#eef2f7;}
h3{color:#001a3d;}
h4{margin-top:25px;}
</style>
</head>

<body>

<header>
<h2>Ranks Based On Estuary</h2>
</header>

<div class="container">
<div id="menuPanel">Loading...</div>
<div id="resultPanel"></div>

<br>
<button onclick="window.location.href='/static/map_modified.html'">⬅ Back</button>
</div>

<script>

const API_BASE="";
const token=localStorage.getItem("access_token");

let CURRENT_DATA=[];
let CURRENT_EST="";
let CURRENT_MED="";
let CURRENT_CATEGORY="";

/* ================= FORMAT ================= */
function formatKey(key){
    const map={
        lt_1mm:"<1 mm",
        mm_1_to_2_5:"1–2.5 mm",
        mm_2_5_to_5:"2.5–5 mm",
        fiber:"Fiber",
        fragment:"Fragment",
        film:"Film",
        foam:"Foam",
        pellet:"Pellet"
    };
    return map[key]||key;
}

/* ================= AUTO LOAD ESTUARIES ================= */
async function showEstuaryMenu(){
    const menu=document.getElementById("menuPanel");
    try{
        const res=await fetch(`${API_BASE}/estuaries`,{
            headers:{Authorization:`Bearer ${token}`}
        });
        const estuaries = res.ok ? await res.json() : [];

        menu.innerHTML = `
            <h3>Select Filters</h3>

            <select id="estuarySelect" onchange="enableCategory()">
                <option value="">Select Estuary</option>
                ${estuaries.map(est=>`<option value="${est}">${est}</option>`).join("")}
            </select>

            <select id="categorySelect" onchange="enableMedium()" disabled>
                <option value="">Select Category</option>
                <option value="microplastic">Microplastic</option>
                <option value="others">Others</option>
            </select>

            <select id="mediumSelect" onchange="loadData()" disabled>
                <option value="">Select Medium</option>
                <option value="sediment">Sediment</option>
                <option value="water">Water</option>
            </select>
        `;
    }catch{
        menu.innerHTML="❌ Failed to load estuaries";
    }
}

/* ================= ENABLE CATEGORY ================= */
function enableCategory(){
    const categorySelect = document.getElementById("categorySelect");
    categorySelect.disabled = document.getElementById("estuarySelect").value === "";
    
    document.getElementById("mediumSelect").disabled = true;
    document.getElementById("mediumSelect").value = "";
}

/* ================= ENABLE MEDIUM ================= */
function enableMedium(){

    const category =
        document.getElementById("categorySelect").value;

    const mediumSelect =
        document.getElementById("mediumSelect");

    if(category === "others"){
        mediumSelect.value = "water";
        mediumSelect.disabled = true;
        loadData();
        return;
    }

    mediumSelect.disabled = false;
}

/* ================= FETCH DATA ================= */
async function getEstuaryData(est){

    // ================= OTHERS =================
    if(CURRENT_CATEGORY === "others"){

        const res = await fetch(
            `${API_BASE}/estuaries/${est}/water-quality`,
            {
                headers:{
                    Authorization:`Bearer ${token}`
                }
            }
        );

        if(!res.ok){
            return [];
        }

        const data = await res.json();

        return (data.points || []).map(p => ({
            ...p,
            lat: p.latitude,
            lon: p.longitude
        }));
    }

    // ================= MICROPLASTIC =================
    const [abRes,shRes,colRes,szRes]=await Promise.all([
        fetch(`${API_BASE}/estuaries/${est}/abundance`,{
            headers:{Authorization:`Bearer ${token}`}
        }),
        fetch(`${API_BASE}/estuaries/${est}/shape`,{
            headers:{Authorization:`Bearer ${token}`}
        }),
        fetch(`${API_BASE}/estuaries/${est}/color`,{
            headers:{Authorization:`Bearer ${token}`}
        }),
        fetch(`${API_BASE}/estuaries/${est}/size`,{
            headers:{Authorization:`Bearer ${token}`}
        })
    ]);

    const abundance=abRes.ok?await abRes.json():{points:[]};
    const shape=shRes.ok?await shRes.json():{points:[]};
    const color=colRes.ok?await colRes.json():{points:[]};
    const size=szRes.ok?await szRes.json():{points:[]};

    let points=[];

    abundance.points.forEach(pt=>{

        const shapePt =
            shape.points?.find(s=>s.station_code===pt.station_code) || {};

        const colorPt =
            color.points?.find(s=>s.station_code===pt.station_code) || {};

        const sizePt =
            size.points?.find(s=>s.station_code===pt.station_code) || {};

        points.push({
            ...pt,
            lat: pt.latitude,
            lon: pt.longitude,
            shape: shapePt,
            color: colorPt,
            size: sizePt
        });
    });

    return points;
}

function renderWaterQualityRanks(points){

    const panel =
        document.getElementById("resultPanel");

    let html =
        `<h3>${CURRENT_EST} - WATER QUALITY</h3>`;

    function buildParamTable(title, field){

        const rows = [...points]
            .filter(p =>
                p[field] !== null &&
                p[field] !== undefined &&
                p[field] !== "Not available"
            )
            .sort((a,b)=>b[field]-a[field]);

        return buildTable(
            `${title} Ranking`,
            ["Rank","Station","Lat","Lon","Value"],
            rows.map(p=>i=>`
                <td>${i+1}</td>
                <td>${p.station_code}</td>
                <td>${p.lat}</td>
                <td>${p.lon}</td>
                <td>${p[field]}</td>
            `)
        );
    }

    html += buildParamTable(
        "Temperature","temperature_c");

    html += buildParamTable(
        "pH","ph");

    html += buildParamTable(
        "Salinity","salinity_psu");

    html += buildParamTable(
        "Dissolved Oxygen",
        "dissolved_oxygen_mg_l");

    html += buildParamTable(
        "Secchi Depth",
        "secchi_depth_m");

    html += buildParamTable(
        "ORP",
        "orp_mv");

    html += buildParamTable(
        "EC",
        "ec_us_cm");

    html += buildParamTable(
        "TDS",
        "tds_ppt");

    panel.innerHTML = html;
}

/* ================= LOAD DATA ================= */
function loadData(){
    const est = document.getElementById("estuarySelect").value;
    const med = document.getElementById("mediumSelect").value;
    const cat = document.getElementById("categorySelect").value;
    if(!est || !med || !cat) return;

    CURRENT_EST = est;
    CURRENT_MED = med;
    CURRENT_CATEGORY = cat;

    showEstuaryRanks(est, med, cat);
}

/* ================= TABLE BUILDER ================= */
function buildTable(title,headers,rows){
    let html=`<h4>${title}</h4><table><tr>`;
    headers.forEach(h=>html+=`<th>${h}</th>`);
    html+="</tr>";
    rows.forEach((r,i)=>{ html+="<tr>"+r(i)+"</tr>"; });
    html+="</table>";
    return html;
}

/* ================= RENDER ================= */
async function showEstuaryRanks(est,med,cat){
    const panel=document.getElementById("resultPanel");
    panel.innerHTML="Loading...";

    let points=await getEstuaryData(est);
    CURRENT_DATA = points;
    if(cat === "others"){
    renderWaterQualityRanks(points);
    return;
}
    if(!points.length){
        panel.innerHTML="❌ No data";
        return;
    }

    let html=`<h3>${est} - ${cat.toUpperCase()} - ${med.toUpperCase()}</h3>`;

    const ab=[...points].sort((a,b)=>(b[`${med}_abundance`]||0)-(a[`${med}_abundance`]||0));
    html+=buildTable("Abundance Ranking",["Rank","Station","Lat","Lon","Value"],ab.map(p=>i=>`
        <td>${i+1}</td>
        <td>${p.station_code}</td>
        <td>${p.lat||"-"}</td>
        <td>${p.lon||"-"}</td>
        <td>${Number(p[`${med}_abundance`]||0).toFixed(3)}</td>
    `));

    function buildRows(key,label){
        let rows=[];
        points.forEach(p=>{
            const obj=p[key]?.[med]||p[key]||{};
            Object.entries(obj).forEach(([k,v])=>{
                rows.push({...p,name:k,value:v});
            });
        });
        rows.sort((a,b)=>b.value-a.value);
        return buildTable(label+" Ranking",["Rank",label,"Station","Lat","Lon","Value"],rows.map(r=>i=>`
            <td>${i+1}</td>
            <td>${formatKey(r.name)}</td>
            <td>${r.station_code}</td>
            <td>${r.lat||"-"}</td>
            <td>${r.lon||"-"}</td>
            <td>${Number(r.value).toFixed(3)}</td>
        `));
    }

    html+=buildRows("color","Color");
    html+=buildRows("shape","Shape");
    html+=buildRows("size","Size");

    panel.innerHTML=html+`
        <br>
        <button onclick="downloadCSV()">⬇ Download CSV</button>
        <button onclick="downloadPDF()">⬇ Download PDF</button>
    `;
}

/* ================= CSV ================= */
function downloadCSV(){
    let csv="Section,Estuary,Station,Lat,Lon,Category,Value\n";

    [...CURRENT_DATA].sort((a,b)=>(b[`${CURRENT_MED}_abundance`]||0)-(a[`${CURRENT_MED}_abundance`]||0))
        .forEach(p=>{
            csv+=`Abundance,${CURRENT_EST},${p.station_code},${p.lat},${p.lon},Total,${p[`${CURRENT_MED}_abundance`]||0}\n`;
        });

    CURRENT_DATA.forEach(p=>{
        const colors=p.color?.[CURRENT_MED]||{};
        Object.entries(colors).forEach(([k,v])=>{ csv+=`Color,${CURRENT_EST},${p.station_code},${p.lat},${p.lon},${k},${v}\n`; });
    });

    CURRENT_DATA.forEach(p=>{
        const shapes=p.shape?.[CURRENT_MED]||{};
        Object.entries(shapes).forEach(([k,v])=>{ csv+=`Shape,${CURRENT_EST},${p.station_code},${p.lat},${p.lon},${k},${v}\n`; });
    });

    CURRENT_DATA.forEach(p=>{
        const sizes=p.size?.[CURRENT_MED]||{};
        Object.entries(sizes).forEach(([k,v])=>{ csv+=`Size,${CURRENT_EST},${p.station_code},${p.lat},${p.lon},${formatKey(k)},${v}\n`; });
    });

    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${CURRENT_EST}_${CURRENT_CATEGORY}_${CURRENT_MED}_FULL.csv`;
    a.click();
}

/* ================= PDF ================= */
function downloadPDF(){
    const { jsPDF } = window.jspdf;
    const doc=new jsPDF();
    let y=10;

    doc.text(`${CURRENT_EST} - ${CURRENT_CATEGORY.toUpperCase()} - ${CURRENT_MED.toUpperCase()} FULL REPORT`,10,y);
    y+=10;

    let abRows=[];
    [...CURRENT_DATA].sort((a,b)=>(b[`${CURRENT_MED}_abundance`]||0)-(a[`${CURRENT_MED}_abundance`]||0))
        .forEach(p=>{ abRows.push([p.station_code,p.lat||"-",p.lon||"-",Number(p[`${CURRENT_MED}_abundance`]||0).toFixed(3)]); });

    doc.text("Abundance",10,y); y+=5;
    doc.autoTable({head:[["Station","Lat","Lon","Value"]],body:abRows,startY:y});
    y=doc.lastAutoTable.finalY+10;

    function buildPdfSection(title,key){
        let rows=[];
        CURRENT_DATA.forEach(p=>{
            const obj=p[key]?.[CURRENT_MED]||{};
            Object.entries(obj).forEach(([k,v])=>{
                rows.push([p.station_code,p.lat||"-",p.lon||"-",formatKey(k),Number(v).toFixed(3)]);
            });
        });
        rows.sort((a,b)=>b[4]-a[4]);
        doc.text(title,10,y); y+=5;
        doc.autoTable({head:[["Station","Lat","Lon",title,"Value"]],body:rows,startY:y});
        y=doc.lastAutoTable.finalY+10;
    }

    buildPdfSection("Color","color");
    buildPdfSection("Shape","shape");
    buildPdfSection("Size","size");

    doc.save(`${CURRENT_EST}_${CURRENT_CATEGORY}_${CURRENT_MED}_FULL_REPORT.pdf`);
}

/* INIT */
showEstuaryMenu();

</script>

</body>
</html>
