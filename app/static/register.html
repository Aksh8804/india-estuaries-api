<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - India Estuary Microplastic Viewer</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container {
  background:white;
  padding:40px;
  width:350px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
  border-radius:8px;
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

input {
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:4px;
}

button {
  width:100%;
  padding:10px;
  background:#023;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:4px;
}

button:hover {
  background:#035;
}

.link {
  text-align:center;
  margin-top:15px;
}

.link a {
  text-decoration:none;
  color:#023;
}

.message {
  margin-top:15px;
  text-align:center;
  font-size:14px;
}
.success { color:green; }
.error { color:red; }
</style>
</head>

<body>

<div class="container">
  <h2>Create Account</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password (min 8 chars)">

  <button onclick="register()">Register</button>

  <div class="message" id="message"></div>

  <div class="link">
    Already have an account?
    <a href="/static/login.html">Login</a>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

async function register() {
  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const messageDiv = document.getElementById("message");

  messageDiv.className = "message";
  messageDiv.innerText = "Creating account...";

  try {
    const response = await fetch(`${API_BASE}/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username,
        email,
        password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      messageDiv.className = "message error";
      messageDiv.innerText = data.detail || "Registration failed.";
      return;
    }

    messageDiv.className = "message success";
    messageDiv.innerHTML = `
      ${data.message}<br><br>
      📧 Please check your email (and spam folder).<br><br>
      <a href="/static/login.html">Go to Login</a>
    `;

  } catch (err) {
    messageDiv.className = "message error";
    messageDiv.innerText = "Server error. Please try again.";
  }
}
</script>

</body>
</html>
