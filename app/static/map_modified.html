

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>India Estuary Microplastic Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>





<style>



body {
  background-color: var(--bg-color);
  color: var(--text-color);
  margin:0;
  font-family: Arial;
}

header { 
  background: var(--header-bg);
  color: #ffffff;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#controls {
  display:flex;
  flex-wrap:wrap;
  padding:10px 20px;
 background: var(--controls-bg);  gap:20px;
  border-bottom: 1px solid #333;
}

.control-group { display:flex; flex-direction:column; }

#mainLayout {
  display: flex;
  height: 80vh;
}

#map {
  flex: 1;
  height: 100%;
}

#maxPanel {
  width: 320px;
  background: #fff8e6;
  padding: 15px;
  border-left: 3px solid #e67e22;
  overflow-y: auto;
}

#chartContainer {
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 50px;        /* space between charts */
}


#barCanvas {
  border-radius: 14px;
  box-shadow: none;
  width: 80%;
  height: 400px !important;
 
}


.pie-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
}

#pieCanvas {
  width: 400px !important;   /* fixed width */
  height: 400px !important;
}

button.logout {
  background:#c0392b;
  border:none;
  color:white;
  padding:6px 12px;
  cursor:pointer;
}

.leaflet-popup-content {
  background: #ffffff !important;
  color: #000000 !important;
  font-size: 13px;
}

.leaflet-popup-tip {
  background: #ffffff !important;
}

.control-group label {
  color: var(--text-color);
  margin-bottom: 4px;
  font-weight: 600;
}

.control-group select {
  background: var(--dropdown-bg);
  color: var(--text-color);
  border: 1px solid #444;
  padding: 4px 6px;
  border-radius: 4px;
}


:root {
  --bg-color: #ffffff;
  --text-color: #111;
 --header-bg: #001a3d;
  --controls-bg: #e8e8e8;
  --popup-bg: #ffffff;
  --dropdown-bg: #ffffff;
}

</style>
</head>



<body>

<header style="flex-direction: column; align-items: flex-start; padding: 15px;">
  <h2 style="margin: 0;">India Estuary Microplastic Viewer</h2>
  
  <!-- About Us link under title -->
  <div style="margin-top: 8px;">
     <a href="/static/about.html"
        style="color:white; text-decoration:none; font-weight:600; font-size:16px;">
        About Us
     </a>
  </div>

  <!-- Theme toggle and logout -->
  <div style="display:flex; gap:20px; margin-top:8px;">
    <button id="themeToggle" style="background:none; border:none; font-size:20px; cursor:pointer;">
      🌙
    </button>

    <button id="logoutBtn" class="logout" onclick="logout()" style="display:none;">
      Logout
    </button>
  </div>
</header>

<div id="controls">
  <div class="control-group">
    <label>Select Estuary:</label>
    <select id="estuarySelect">
      <option value="">-- Choose --</option>
      <option value="Palar">Palar</option>
      <option value="Kollidam">Kollidam</option>
      <option value="Pulicat">Pulicat</option>
    </select>
  </div>

<div class="control-group">
  <label>Select Medium:</label>
  <select id="mediumSelect" disabled>
    <option value="">-- Choose --</option>
    <option value="water">Water</option>
    <option value="sediment">Sediment</option>
  </select>
</div>

  <div class="control-group">
    <label>Select Layer:</label>
    <select id="layerSelect" disabled>
      <option value="">-- Choose --</option>
      <option value="abundance">Abundance</option>
      <option value="shape">Shape</option>
      <option value="color">Color</option>
      <option value="size">Size</option>
    </select>
  </div>
</div>

<div id="mainLayout">
  <div id="map"></div>

 
</div>

<div id="chartContainer">
  <canvas id="barCanvas"></canvas>

  <div class="pie-wrapper">
    <canvas id="pieCanvas"></canvas>
  </div>
</div>



<script>
// ===== AUTH CHECK (run immediately) =====
const token = localStorage.getItem("access_token");
if(token){
  document.getElementById("logoutBtn").style.display = "inline-block";
}  


if (!token) {
  // Not logged in → redirect immediately
   window.location.href = "/static/login.html";
}

// ===== LOGOUT FUNCTION =====
function logout() {
  localStorage.removeItem("access_token");
  window.location.href = "/static/login.html";
}

Chart.defaults.font.family = "Arial";
Chart.defaults.font.size = 13;
Chart.defaults.color = "#333";

const API_BASE = "https://india-estuaries-api.onrender.com";

const SIZE_KEYS = ["lt_1mm","mm_1_to_2_5","mm_2_5_to_5"];
const SHAPE_KEYS = ["fiber","fragment","film","foam","pellet"];

let COLOR_KEYS = [];

let currentEstuary = "";
let currentPoints = [];

let barChart = null;
let pieChart = null;



/* ================= MAP ================= */

const map = L.map("map").setView([12.8, 80.2], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const markers = L.layerGroup().addTo(map);

/* ================= LOAD ESTUARY ================= */

document.getElementById("estuarySelect")
.addEventListener("change", loadEstuary);

async function loadEstuary(){

  currentEstuary = this.value;
document.getElementById("mediumSelect").disabled = false;
document.getElementById("layerSelect").disabled = true;
document.getElementById("mediumSelect").value = "";
document.getElementById("layerSelect").value = "";

if(barChart) barChart.destroy();
if(pieChart) pieChart.destroy();
  if(!currentEstuary) return;

  markers.clearLayers();
  currentPoints = [];

  try{

    const [abRes, shRes, colRes, szRes] = await Promise.all([
  fetch(`${API_BASE}/estuaries/${currentEstuary}/abundance`, {
    headers: { "Authorization": `Bearer ${token}` }
  }),
  fetch(`${API_BASE}/estuaries/${currentEstuary}/shape`, {
    headers: { "Authorization": `Bearer ${token}` }
  }),
  fetch(`${API_BASE}/estuaries/${currentEstuary}/color`, {
    headers: { "Authorization": `Bearer ${token}` }
  }),
  fetch(`${API_BASE}/estuaries/${currentEstuary}/size`, {
    headers: { "Authorization": `Bearer ${token}` }
  })
]);

    const abundance = abRes.ok ? await abRes.json() : { points: [] };
    const shape     = shRes.ok ? await shRes.json() : { points: [] };
    const color     = colRes.ok ? await colRes.json() : { points: [] };
    const size      = szRes.ok ? await szRes.json() : { points: [] };

    if(!abundance.points || abundance.points.length === 0) {
    alert("No data available for this estuary.");
    return;
    }

    COLOR_KEYS = color.points?.length
      ? Object.keys(color.points[0].water)
      : [];

    currentPoints = abundance.points.map(pt => {

      const shapePt = shape.points?.find(s => s.station_code === pt.station_code) || {};
      const colorPt = color.points?.find(s => s.station_code === pt.station_code) || {};
      const sizePt  = size.points?.find(s => s.station_code === pt.station_code) || {};

      return {
        ...pt,
        shape: shapePt,
        color: colorPt,
        size: sizePt
      };
    });

    /* ===== MARKERS ===== */

    currentPoints.forEach(pt => {

      const popup = `
        <div style="max-height:300px; overflow-y:auto; font-size:13px;">
          <b>${pt.station_code}</b><br><br>

          <b>Abundance</b><br>
          Water: ${pt.water_abundance}<br>
          Sediment: ${pt.sediment_abundance}<br><br>

          <b>Size (Water)</b><br>
          ${formatObj(pt.size?.water)}<br><br>

          <b>Size (Sediment)</b><br>
          ${formatObj(pt.size?.sediment)}<br><br>

          <b>Shape (Water)</b><br>
          ${formatObj(pt.shape?.water)}<br><br>

          <b>Shape (Sediment)</b><br>
          ${formatObj(pt.shape?.sediment)}<br><br>

          <b>Color (Water)</b><br>
          ${formatObj(pt.color?.water)}<br><br>

          <b>Color (Sediment)</b><br>
          ${formatObj(pt.color?.sediment)}
        </div>
      `;

      const marker = L.marker([pt.latitude, pt.longitude])
        .bindPopup(popup, { maxWidth: 350 });

      markers.addLayer(marker);  // 
    });

  

  }catch(err){
    console.error(err);
    alert("Error loading data");
  }
}

/* ================= FORMAT ================= */

function formatObj(obj){
  if(!obj) return "No data";

  const keyMap = {
    "lt_1mm": "< 1 mm",
    "mm_1_to_2_5": "1 mm to 2.5 mm",
    "mm_2_5_to_5": "2.5 mm to 5 mm"
  };

  return Object.entries(obj)
    .map(([k,v]) => {
      const formattedKey = keyMap[k] || k;
      return `${formattedKey} : ${v}`;
    })
    .join("<br>");
}


function formatKey(key){

  const keyMap = {
    // Size
    "lt_1mm": "< 1 mm",
    "mm_1_to_2_5": "1 mm to 2.5 mm",
    "mm_2_5_to_5": "2.5 mm to 5 mm",

    // Shape
    "fiber": "Fiber",
    "fragment": "Fragment",
    "film": "Film",
    "foam": "Foam",
    "pellet": "Pellet"
  };

  return keyMap[key] || key;
}

/* ================= CHARTS ================= */

document.getElementById("layerSelect")
.addEventListener("change", drawCharts);

document.getElementById("mediumSelect")
.addEventListener("change", function(){

  const layerSelect = document.getElementById("layerSelect");

  if(this.value){
    layerSelect.disabled = false;
  } else {
    layerSelect.disabled = true;
  }

  if(barChart) barChart.destroy();
  if(pieChart) pieChart.destroy();
});

function drawCharts(){

  const layer = document.getElementById("layerSelect").value;
  const medium = document.getElementById("mediumSelect").value;

  if(!currentEstuary || !medium || !layer || currentPoints.length === 0){
  return;
}

  document.getElementById("chartContainer").style.display="block";

  if(barChart) barChart.destroy();
  if(pieChart) pieChart.destroy();

  if(layer === "abundance"){
    drawAbundance();
  }
  else if(layer === "size"){
    drawStacked("size", SIZE_KEYS);
  }
  else if(layer === "shape"){
    drawStacked("shape", SHAPE_KEYS);
  }
  else if(layer === "color"){
    drawStacked("color", COLOR_KEYS);
  }
}

function drawAbundance(){

  const medium = document.getElementById("mediumSelect").value;

  const barCtx = document.getElementById("barCanvas");
  const pieCtx = document.getElementById("pieCanvas");

  const values = currentPoints.map(p => p[`${medium}_abundance`] || 0);

barChart = new Chart(barCtx,{
  type:"bar",
  data:{
    labels: currentPoints.map(p=>p.station_code),
    datasets:[{
      label: medium.toUpperCase() + " Abundance",
      data: values,
      borderWidth: 1
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,   //
    plugins:{
      title:{
        display:true,
        text: medium.toUpperCase() + " Abundance by Station"
      },
      legend:{ display:false }
    },
    scales:{
      y:{
        beginAtZero:true,
        title:{
          display:true,
          text:"Abundance"
        }
      }
    }
  }
});

  pieChart = new Chart(pieCtx,{
    type:"pie",
    data:{
      labels: currentPoints.map(p=>p.station_code),
      datasets:[{
        data: values
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio: true,
      plugins:{
        title:{
          display:true,
          text:"Distribution Across Stations"
        }
      }
    }
  });
}


function drawStacked(type, keys){

  const medium = document.getElementById("mediumSelect").value;

  const barCtx = document.getElementById("barCanvas");
  const pieCtx = document.getElementById("pieCanvas");

  barChart = new Chart(barCtx,{
    type:"bar",
    data:{
      labels: currentPoints.map(p=>p.station_code),
      datasets: keys.map(k => ({
        label: formatKey(k),
        data: currentPoints.map(p =>
          (p[type]?.[medium]?.[k] || 0)
        ),
        borderWidth:1
      }))
    },
    options:{
      responsive:true,
      maintainAspectRatio: false,
      plugins:{
        title:{
          display:true,
          text: `${type.toUpperCase()} (${medium.toUpperCase()})`
        }
      },
      scales:{
        x:{ stacked:true },
        y:{ stacked:true, beginAtZero:true }
      }
    }
  });

  // ===== Pie Chart (Total Distribution) =====

  const totals = {};
  keys.forEach(k => totals[k] = 0);

  currentPoints.forEach(p=>{
    keys.forEach(k=>{
      totals[k] += (p[type]?.[medium]?.[k] || 0);
    });
  });

  pieChart = new Chart(pieCtx,{
    type:"pie",
    data:{
      labels: keys.map(k => formatKey(k)),
      datasets:[{
        data: keys.map(k=>totals[k])
      }]
    },
    options:{
      responsive:true,
      plugins:{
        title:{
          display:true,
          text:`Total ${type.toUpperCase()} Distribution`
        }
      }
    }
  });
}
 
/* ================= DARK MODE ================= */

const themeToggle = document.getElementById("themeToggle");
let darkMode = false;

themeToggle.addEventListener("click", () => {
  darkMode = !darkMode;

  if(darkMode){
    themeToggle.textContent = "☀️";

    Chart.defaults.color = "#f1f1f1";

    document.documentElement.style.setProperty('--bg-color', '#2a2a2a');
    document.documentElement.style.setProperty('--text-color', '#eee');
    document.documentElement.style.setProperty('--header-bg', '#001a3d'); // dark blue
    document.documentElement.style.setProperty('--controls-bg', '#333333');
    document.documentElement.style.setProperty('--popup-bg', '#2a2a2a');
    document.documentElement.style.setProperty('--dropdown-bg', '#222');


    Chart.defaults.color = "#f1f1f1";

  } else {
    themeToggle.textContent = "🌙";


    document.documentElement.style.setProperty('--bg-color', '#ffffff');
    document.documentElement.style.setProperty('--text-color', '#111');
    document.documentElement.style.setProperty('--header-bg', '#001a3d'); // dark blue
    document.documentElement.style.setProperty('--controls-bg', '#e8e8e8');
    document.documentElement.style.setProperty('--popup-bg', '#ffffff');
    document.documentElement.style.setProperty('--dropdown-bg', '#ffffff');

    Chart.defaults.color = "#333";
  }
});

</script>
</body>
</html>
