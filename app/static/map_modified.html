<script>

/* ================= MAP ================= */

const map = L.map("map").setView([12.8, 80.2], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const markers = L.layerGroup().addTo(map);

const API_BASE = "https://india-estuaries-api.onrender.com";


/* ================= UI REFERENCES ================= */

const estuarySelect = document.getElementById("estuarySelect");
const mediumSelect  = document.getElementById("mediumSelect");
const layerSelect   = document.getElementById("layerSelect");

const chartContainer = document.getElementById("chartContainer");

let currentEstuary = null;


/* ================= ESTUARY CHANGE ================= */

estuarySelect.addEventListener("change", loadEstuary);

async function loadEstuary() {

  const estuary = estuarySelect.value;
  if (!estuary) return;

  currentEstuary = estuary;

  mediumSelect.disabled = false;
  layerSelect.disabled  = true;

  markers.clearLayers();

  try {

    const [abRes, shRes, colRes, szRes] = await Promise.all([
      fetch(`${API_BASE}/estuaries/${estuary}/abundance`),
      fetch(`${API_BASE}/estuaries/${estuary}/shape`),
      fetch(`${API_BASE}/estuaries/${estuary}/color`),
      fetch(`${API_BASE}/estuaries/${estuary}/size`)
    ]);

    const abundance = await abRes.json();
    const shape     = await shRes.json();
    const color     = await colRes.json();
    const size      = await szRes.json();

    abundance.points.forEach(pt => {

      const popup = `
        <b>${pt.station_code}</b><br>
        Water Abundance: ${pt.water_abundance}<br>
        Sediment Abundance: ${pt.sediment_abundance}
      `;

      const marker = L.marker([pt.latitude, pt.longitude])
        .bindPopup(popup);

      markers.addLayer(marker);

    });

  } catch (err) {

    console.error(err);
    alert("Error loading estuary data.");

  }

}


/* ================= MEDIUM SELECT ================= */

mediumSelect.addEventListener("change", () => {

  if (!mediumSelect.value) {
    layerSelect.disabled = true;
    return;
  }

  layerSelect.disabled = false;

});


/* ================= LAYER SELECT ================= */

layerSelect.addEventListener("change", async () => {

  const layer  = layerSelect.value;
  const medium = mediumSelect.value;

  if (!layer || !medium || !currentEstuary) return;

  chartContainer.style.display = "flex";

  try {

    const res = await fetch(`${API_BASE}/estuaries/${currentEstuary}/${layer}`);
    const data = await res.json();

    renderCharts(data, layer, medium);

  } catch (err) {

    console.error(err);
    alert("Error loading chart data");

  }

});


/* ================= CHARTS ================= */

let barChart = null;
let pieChart = null;

function renderCharts(data, layer, medium) {

  const barCanvas = document.getElementById("barCanvas");
  const pieCanvas = document.getElementById("pieCanvas");

  const labels = [];
  const values = [];

  data.data.forEach(item => {
    labels.push(item.category);
    values.push(item.value);
  });

  if (barChart) barChart.destroy();
  if (pieChart) pieChart.destroy();

  barChart = new Chart(barCanvas, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: `${layer} (${medium})`,
        data: values
      }]
    },
    options: {
      responsive: true
    }
  });

  pieChart = new Chart(pieCanvas, {
    type: "pie",
    data: {
      labels: labels,
      datasets: [{
        data: values
      }]
    }
  });

}

</script>
