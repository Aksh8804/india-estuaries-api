

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>India Estuary Microplastic Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/static/css/style.css">	
</head>



<body>

<header style="padding:15px; position:relative; text-align:center;">

  <h2 style="margin:0; font-size:26px; letter-spacing:0.5px;">
    India's Estuary Microplastic Viewer
  </h2>

</header>

  

<div id="topPanel">

  <div style="display:flex; justify-content:space-between; align-items:center;">

    <div>
      <a href="/static/about.html"
         style="font-weight:600; text-decoration:none; color:#001a3d;">
         About Us
      </a>

      <div id="analysisSubOptions"></div>
      <div id="dynamicPanel"></div>
      <div id="taskResult"></div>
    </div>

    <div style="display:flex; gap:10px;">



  
 

  <button id="logoutBtn"
    class="logout"
    onclick="logout()"
    style="display:none;">
    Logout
  </button>

</div>

  </div>

</div>

  

<div id="controls">
  <div class="control-group">
    <label>Select Estuary:</label>
    <select id="estuarySelect">
      <option value="">-- Choose --</option>
      <option value="Palar">Palar</option>
      <option value="Kollidam">Kollidam</option>
      <option value="Pulicat">Pulicat</option>
    </select>
  </div>

<div class="control-group">
  <label>Select Category:</label>
  <select id="categorySelect" disabled>
    <option value="">-- Choose --</option>
    <option value="microplastic">Microplastics</option>
    <option value="others">Others</option>
  </select>
</div>

 <div class="control-group">
   <label>Select Medium:</label>
   <select id="mediumSelect" disabled>
     <option value="">-- Choose --</option>
     <option value="water">Water</option>
     <option value="sediment">Sediment</option>
   </select>
  </div>

   <div class="control-group">
     <label>Select Layer:</label>
     <select id="layerSelect" disabled>
       <option value="">-- Choose --</option>
       <option value="abundance">Abundance</option>
       <option value="shape">Shape</option>
       <option value="color">Color</option>
       <option value="size">Size</option>
     </select>
   </div>

<div class="control-group">
  <label>Map Chart Type (Abundance only):</label>
  <select id="mapChartType" disabled>
    <option value="">-- Choose --</option>
    <option value="bar">Bar Chart</option>
    <option value="pie">Pie Chart</option>
  </select>
</div>


<div class="control-group">
     <label>Select Microplastic Type:</label>
     <select id="typeSelect" disabled>
      <option value="">-- Choose --</option>
     </select>
   </div>

<div class="control-group">
  <label>Select Analysis Task:</label>
  <select id="analysisType">
    <option value="">-- Choose --</option>
    <option value="highest">Highest Values Across All Estuaries</option>
    <option value="lowest">Lowest Values Across All Estuaries</option>
    <option value="state">Ranks Based On State</option>
    <option value="estuary">Ranks Based On Estuaries</option>
    

  </select>
</div>

 </div>

   

<div id="mainLayout">
  <div id="map"></div>

 
</div>

<div id="chartContainer">
  <canvas id="barCanvas"></canvas>

  <div class="pie-wrapper">
    <canvas id="pieCanvas"></canvas>
  </div>

  <!-- MOVE HERE -->
  <div id="chartDownloadBtns">
    <button onclick="downloadBarChart()">⬇ Download Bar Chart</button>
    <button onclick="downloadPieChart()">⬇ Download Pie Chart</button>
    <button onclick="downloadChartsPDF()">⬇ Download PDF</button>
  </div>
</div>
<script src="/static/js/config.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/map.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/estuary.js"></script>
<script src="/static/js/analysis.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
