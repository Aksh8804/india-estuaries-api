<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>India Estuary Microplastic Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { height:100%; margin:0; padding:0; }

body{
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: Arial;
}

header{
  background: var(--header-bg);

  display:none;

  background:#c0392b;

}

:root{
  --bg-color:#ffffff;
  --text-color:#111;
  --header-bg:#001a3d;
  --controls-bg:#e8e8e8;
  --dropdown-bg:#ffffff;
}
</style>
</head>

<body>

<header style="flex-direction: column; align-items: flex-start; padding: 15px;">
<h2 style="margin:0;">India Estuary Microplastic Viewer</h2>

<div style="margin-top:8px;">
<a href="/static/about.html" style="color:white;text-decoration:none;font-weight:600;">
About Us
</a>
</div>

<div style="display:flex;gap:20px;margin-top:8px;">
<button id="themeToggle" style="background:none;border:none;font-size:20px;">🌙</button>
<button id="logoutBtn" class="logout" onclick="logout()" style="display:none;">Logout</button>
</div>
</header>

<div id="controls">
<div class="control-group">
<label>Select Estuary:</label>
<select id="estuarySelect">
<option value="">-- Choose --</option>
<option value="Palar">Palar</option>
<option value="Kollidam">Kollidam</option>
<option value="Pulicat">Pulicat</option>
</select>
</div>

<div class="control-group">
<label>Select Medium:</label>
<select id="mediumSelect" disabled>
<option value="">-- Choose --</option>
<option value="water">Water</option>
<option value="sediment">Sediment</option>
</select>
</div>

<div class="control-group">
<label>Select Layer:</label>
<select id="layerSelect" disabled>
<option value="">-- Choose --</option>
<option value="abundance">Abundance</option>
<option value="shape">Shape</option>
<option value="color">Color</option>
<option value="size">Size</option>
</select>
</div>
</div>

<div id="mainLayout">
<div id="map"></div>
</div>

<div id="chartContainer">
<canvas id="barCanvas"></canvas>
<div class="pie-wrapper">
<canvas id="pieCanvas"></canvas>
</div>
</div>

<script>

/* ================= TEMP AUTH SYSTEM ================= */

let token = localStorage.getItem("access_token");
let viewCount = parseInt(localStorage.getItem("guest_views") || "0");

if(token){
  document.getElementById("logoutBtn").style.display="inline-block";
}
else{
  if(viewCount >= 3){
    alert("Guest limit reached. Please login.");
    window.location.href="/static/login.html";
  }
}

function registerGuestView(){
  if(!token){
    viewCount++;
    localStorage.setItem("guest_views", viewCount);
  }
}

function logout(){
  localStorage.removeItem("access_token");
  window.location.href="/static/login.html";
}

/* ================= MAP ================= */

const map = L.map("map").setView([12.8,80.2],7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 attribution:"© OpenStreetMap"
}).addTo(map);

const markers = L.layerGroup().addTo(map);

const API_BASE="https://india-estuaries-api.onrender.com";

/* ================= LOAD ESTUARY ================= */

document.getElementById("estuarySelect").addEventListener("change",loadEstuary);

async function loadEstuary(){

registerGuestView();

const estuary=this.value;
if(!estuary) return;

document.getElementById("mediumSelect").disabled=false;

markers.clearLayers();

try{

const headers = token ? { "Authorization":`Bearer ${token}` } : {};

const [abRes,shRes,colRes,szRes] = await Promise.all([
fetch(`${API_BASE}/estuaries/${estuary}/abundance`,{headers}),
fetch(`${API_BASE}/estuaries/${estuary}/shape`,{headers}),
fetch(`${API_BASE}/estuaries/${estuary}/color`,{headers}),
fetch(`${API_BASE}/estuaries/${estuary}/size`,{headers})
]);

const abundance = await abRes.json();
const shape = await shRes.json();
const color = await colRes.json();
const size = await szRes.json();

abundance.points.forEach(pt=>{

const popup=`
<b>${pt.station_code}</b><br>
Water Abundance: ${pt.water_abundance}<br>
Sediment Abundance: ${pt.sediment_abundance}
`;

const marker=L.marker([pt.latitude,pt.longitude])
.bindPopup(popup);

markers.addLayer(marker);

});

}
catch(err){
console.error(err);
alert("Error loading data");
}

}

/* ================= CHART PLACEHOLDER ================= */

document.getElementById("mediumSelect").addEventListener("change",function(){
document.getElementById("layerSelect").disabled=!this.value;
});

</script>

</body>
</html>
