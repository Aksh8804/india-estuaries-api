<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f4f8;
      font-family:Arial;
    }

    .card {
      background:white;
      padding:40px;
      border-radius:10px;
      width:350px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      text-align:center;
    }

    h2 {
      margin-bottom:25px;
    }

    input {
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:14px;
    }

    button {
      width:100%;
      padding:10px;
      background:#023;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-bottom:15px;
      font-size:14px;
    }

    button:disabled {
      background:#777;
      cursor:not-allowed;
    }

    .links {
      font-size:14px;
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .links a {
      color:#023;
      text-decoration:none;
    }

    .links a:hover {
      text-decoration:underline;
    }

    #error {
      color:red;
      margin-top:10px;
      min-height:20px;
    }

    #success {
      color:green;
      margin-bottom:10px;
      min-height:20px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Login</h2>

  <div id="success"></div>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" id="loginBtn">Login</button>
  </form>

<a href="/static/register.html">Create Account</a>
<a href="/static/forgot-password.html">Forgot Password?</a>
<a href="/static/resend-verification.html">Resend-Verification Email</a>  <p id="error"></p>
</div>

<script>
const API_BASE = "https://india-estuaries-api.onrender.com";

// 🔒 If already logged in → go to map
if(localStorage.getItem("access_token")){
window.location.href = "/static/map_modified.html";
}

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("error");

    errorBox.innerText = "";
    loginBtn.disabled = true;
    loginBtn.innerText = "Logging in...";

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // ⚠️ IMPORTANT: Use form-urlencoded (required by OAuth2PasswordRequestForm)
    const formData = new URLSearchParams();
    formData.append("username", username);
    formData.append("password", password);

    try {
        const response = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData
        });

        const data = await response.json();

        if(response.ok){
            localStorage.setItem("access_token", data.access_token);
           window.location.href = "/static/map_modified.html";
        } else {
            errorBox.innerText = data.detail || "Login failed";
        }

    } catch (err) {
        errorBox.innerText = "Server error. Please try again.";
    }

    loginBtn.disabled = false;
    loginBtn.innerText = "Login";
});
</script>

</body>
</html>
