<script>
// ===== AUTH CHECK (run immediately) =====
const token = localStorage.getItem("access_token");
if(token){
  document.getElementById("logoutBtn").style.display = "inline-block";
}  


if (!token) {
  // Not logged in → redirect immediately
   window.location.href = "/static/login.html";
}

// ===== LOGOUT FUNCTION =====
function logout() {
  localStorage.removeItem("access_token");
  window.location.href = "/static/login.html";
}

Chart.defaults.font.family = "Arial";
Chart.defaults.font.size = 13;
Chart.defaults.color = "#333";

const API_BASE = "https://india-estuaries-api.onrender.com";

const SIZE_KEYS = ["lt_1mm","mm_1_to_2_5","mm_2_5_to_5"];
const SHAPE_KEYS = ["fiber","fragment","film","foam","pellet"];

let COLOR_KEYS = [];

let currentEstuary = "";
let currentPoints = [];

let barChart = null;
let pieChart = null;



/* ================= MAP ================= */

const map = L.map("map").setView([12.8, 80.2], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const markers = L.layerGroup().addTo(map);
const pieMarkers = L.layerGroup().addTo(map);

function toggleMenu(){
  const menu = document.getElementById("taskMenu");
  menu.style.display = menu.style.display === "none" ? "block" : "none";
}
function formatObj(obj) {
  if (!obj) return "N/A";
  return Object.entries(obj)
    .map(([k,v]) => `${formatKey(k)}: ${v}`)
    .join(", ");
}
const CHART_COLORS = [
  "#AEC6CF", // pastel blue
  "#FFD1DC", // pastel pink
  "#C1E1C1", // pastel green
  "#FFFACD", // pastel yellow
  "#FFB347", // pastel orange
  "#B39EB5", // pastel purple
  "#FF6961", // pastel red
  "#77DD77", // pastel mint green
  "#FDFD96", // pastel lemon
  "#84B6F4"  // pastel sky blue
];/* ================= LOAD ESTUARY ================= */
document.getElementById("estuarySelect")
.addEventListener("change", loadEstuary);
async function loadEstuary(){
  currentEstuary = this.value;
document.getElementById("mediumSelect").disabled = false;
document.getElementById("layerSelect").disabled = true;
document.getElementById("mediumSelect").value = "";
document.getElementById("layerSelect").value = "";
if(barChart) barChart.destroy();
if(pieChart) pieChart.destroy();
  if(!currentEstuary) return;
  markers.clearLayers();
  currentPoints = [];
  try{
    const [abRes, shRes, colRes, szRes] = await Promise.all([
  fetch(`${API_BASE}/estuaries/${currentEstuary}/abundance`, {
    headers: { "Authorization": `Bearer ${token}` }
  }),
  fetch(`${API_BASE}/estuaries/${currentEstuary}/shape`, {
    headers: { "Authorization": `Bearer ${token}` }
  }),
  fetch(`${API_BASE}/estuaries/${currentEstuary}/color`, {
    headers: { "Authorization": `Bearer ${token}` }
  }),
  fetch(`${API_BASE}/estuaries/${currentEstuary}/size`, {
    headers: { "Authorization": `Bearer ${token}` }
  })
]);
    const abundance = abRes.ok ? await abRes.json() : { points: [] };
    const shape     = shRes.ok ? await shRes.json() : { points: [] };
    const color     = colRes.ok ? await colRes.json() : { points: [] };
    const size      = szRes.ok ? await szRes.json() : { points: [] };
    if(!abundance.points || abundance.points.length === 0) {
    alert("No data available for this estuary.");
    return;
    }
    COLOR_KEYS = color.points?.length
      ? Object.keys(color.points[0].water)
      : [];
    currentPoints = abundance.points.map(pt => {
      const shapePt = shape.points?.find(s => s.station_code === pt.station_code) || {};
      const colorPt = color.points?.find(s => s.station_code === pt.station_code) || {};
      const sizePt  = size.points?.find(s => s.station_code === pt.station_code) || {};
      return {
        ...pt,
        shape: shapePt,
        color: colorPt,
        size: sizePt
      };
    });
    /* ===== MARKERS ===== */
    currentPoints.forEach(pt => {
      const popup = `
        <div style="max-height:300px; overflow-y:auto; font-size:13px;">
          <b>${pt.station_code}</b><br><br>
          <b>Abundance</b><br>
          Water: ${pt.water_abundance}<br>
          Sediment: ${pt.sediment_abundance}<br><br>
          <b>Size (Water)</b><br>
          ${formatObj(pt.size?.water)}<br><br>
          <b>Size (Sediment)</b><br>
          ${formatObj(pt.size?.sediment)}<br><br>
          <b>Shape (Water)</b><br>
          ${formatObj(pt.shape?.water)}<br><br>
          <b>Shape (Sediment)</b><br>
          ${formatObj(pt.shape?.sediment)}<br><br>
          <b>Color (Water)</b><br>
          ${formatObj(pt.color?.water)}<br><br>
          <b>Color (Sediment)</b><br>
          ${formatObj(pt.color?.sediment)}
        </div>
      `;
      const marker = L.marker([pt.latitude, pt.longitude])
        .bindPopup(popup, { maxWidth: 350 });
      markers.addLayer(marker);  // 
    });

// ===== AUTO ZOOM TO ESTUARY =====
if(markers.getLayers().length > 0){
  const group = L.featureGroup(markers.getLayers());
  map.fitBounds(group.getBounds(), { padding: [40, 40] });
}

  }catch(err){
    console.error(err);
    alert("Error loading data");
  }
}
/* ================= FORMAT ================= */
function formatObj(obj){
  if(!obj) return "No data";
  const keyMap = {
    "lt_1mm": "< 1 mm",
    "mm_1_to_2_5": "1 mm to 2.5 mm",
    "mm_2_5_to_5": "2.5 mm to 5 mm"
  };
  return Object.entries(obj)
    .map(([k,v]) => {
      const formattedKey = keyMap[k] || k;
      return `${formattedKey} : ${v}`;
    })
    .join("<br>");
}
function formatKey(key){
  const keyMap = {
    // Size
    "lt_1mm": "< 1 mm",
    "mm_1_to_2_5": "1 mm to 2.5 mm",
    "mm_2_5_to_5": "2.5 mm to 5 mm",
    // Shape
    "fiber": "Fiber",
    "fragment": "Fragment",
    "film": "Film",
    "foam": "Foam",
    "pellet": "Pellet"
  };
  return keyMap[key] || key;
}
/* ================= CHARTS ================= */
document.getElementById("layerSelect")
.addEventListener("change", function(){

  const layer = this.value;
  const typeSelect = document.getElementById("typeSelect");

  typeSelect.innerHTML = `<option value="">-- Choose --</option>`;
  typeSelect.disabled = false;

  let keys = [];

  if(layer === "size") keys = SIZE_KEYS;
  else if(layer === "shape") keys = SHAPE_KEYS;
  else if(layer === "color") keys = COLOR_KEYS;
  else if(layer === "abundance"){
    typeSelect.disabled = true;
    drawCharts();

    // ADD THIS LINE
    document.getElementById("chartContainer").style.display = "block";

    return;
  }

 keys.forEach(k=>{
  const option = document.createElement("option");
  option.value = k;
  option.textContent = formatKey(k);
  typeSelect.appendChild(option);
});

// ADD THIS LINE
drawCharts();

  // ADD THIS LINE
  document.getElementById("chartContainer").style.display = "block";

});

document.getElementById("mediumSelect")
.addEventListener("change", function(){

  const layerSelect = document.getElementById("layerSelect");
  const typeSelect = document.getElementById("typeSelect");

  if(this.value){
    layerSelect.disabled = false;
  } else {
    layerSelect.disabled = true;
  }

  // Reset type selection
  typeSelect.value = "";
  typeSelect.disabled = true;

  if(barChart) barChart.destroy();
  if(pieChart) pieChart.destroy();
});

function drawCharts(){

  const layer = document.getElementById("layerSelect").value;
  const medium = document.getElementById("mediumSelect").value;

  if(!currentEstuary || !medium || !layer || currentPoints.length === 0){
    return;
  }

  document.getElementById("chartContainer").style.display="block";

  if(barChart) barChart.destroy();
  if(pieChart) pieChart.destroy();

  markers.clearLayers(); 
  pieMarkers.clearLayers();

 if(layer === "abundance"){
  drawAbundance();
  drawAbundanceMapPie();
}

  else if(layer === "size"){
    drawStacked("size", SIZE_KEYS);
    drawMapPieCharts("size", SIZE_KEYS);
  }

  else if(layer === "shape"){
    drawStacked("shape", SHAPE_KEYS);
    drawMapPieCharts("shape", SHAPE_KEYS);
  }

  else if(layer === "color"){
    drawStacked("color", COLOR_KEYS);
    drawMapPieCharts("color", COLOR_KEYS);
  }

}
function drawAbundance(){
  const medium = document.getElementById("mediumSelect").value;
  const barCtx = document.getElementById("barCanvas").getContext("2d");
const pieCtx = document.getElementById("pieCanvas").getContext("2d");
  const values = currentPoints.map(p => p[`${medium}_abundance`] || 0);

barChart = new Chart(barCtx,{
  type:"bar",
  data:{
    labels: currentPoints.map(p=>p.station_code),
    datasets:[{
  data: values,
  backgroundColor: CHART_COLORS.slice(0, values.length)
}]  },
  options:{
    responsive:true,
    maintainAspectRatio:false,   //
    plugins:{
      title:{
        display:true,
        text: medium.toUpperCase() + " Abundance by Station"
      },
      legend:{ display:false }
    },
    scales:{
      y:{
        beginAtZero:true,
        title:{
          display:true,
          text:"Abundance"
        }
      }
    }
  }
});
  pieChart = new Chart(pieCtx,{
    type:"pie",
    data:{
      labels: currentPoints.map(p=>p.station_code),
      datasets:[{
  data: values,
  backgroundColor: CHART_COLORS.slice(0, values.length)
}]
    },
    options:{
      responsive:true,
      maintainAspectRatio: true,
      plugins:{
        title:{
          display:true,
          text:"Distribution Across Stations"
        }
      }
    }
  });
}


// ===== Pie Chart on map =====

function drawMapPieCharts(type, keys){

  const medium = document.getElementById("mediumSelect").value;

  pieMarkers.clearLayers();

  currentPoints.forEach(pt => {

    const values = keys.map(k => (pt[type]?.[medium]?.[k] || 0));

    const total = values.reduce((a,b)=>a+b,0);
    if(total === 0) return;

    const canvas = document.createElement("canvas");
    canvas.width = 60;
    canvas.height = 60;

    new Chart(canvas,{
      type:"pie",
      data:{
        labels: keys.map(k=>formatKey(k)),
        datasets:[{
          data: values,
          backgroundColor: CHART_COLORS
        }]
      },
      options:{
        responsive:false,
        plugins:{
          legend:{display:false}
        }
      }
    });

    const icon = L.divIcon({
      html: canvas,
      className:"",
      iconSize:[60,60]
    });

    const marker = L.marker([pt.latitude, pt.longitude],{icon});

    pieMarkers.addLayer(marker);

  });

addMapLegend(keys);

}

// ===== Abundance Pie Chart on Map =====
function drawAbundanceMapPie(){

  const medium = document.getElementById("mediumSelect").value;

  pieMarkers.clearLayers();

  const values = currentPoints.map(p => p[`${medium}_abundance`] || 0);

  const total = values.reduce((a,b)=>a+b,0);
  if(total === 0) return;

  currentPoints.forEach((pt,i)=>{

    const canvas = document.createElement("canvas");
    canvas.width = 60;
    canvas.height = 60;

    const stationValue = values[i];
    const others = total - stationValue;

    new Chart(canvas,{
      type:"pie",
      data:{
        labels:["Station","Others"],
        datasets:[{
          data:[stationValue, others],
          backgroundColor:["#FF8C00","#D3D3D3"]
        }]
      },
      options:{
        responsive:false,
        plugins:{
          legend:{display:false}
        }
      }
    });

    const icon = L.divIcon({
      html: canvas,
      className:"",
      iconSize:[60,60]
    });

    const marker = L.marker([pt.latitude, pt.longitude],{icon});

    pieMarkers.addLayer(marker);

  });

}

function drawTypeChart(){

  const layer = document.getElementById("layerSelect").value;
  const medium = document.getElementById("mediumSelect").value;
  const type = document.getElementById("typeSelect").value;

  if(!layer || !medium || !type) return;

  // Keep bottom charts visible
  document.getElementById("chartContainer").style.display="block";

  // Remove markers and pie charts
  markers.clearLayers();
  pieMarkers.clearLayers();

  currentPoints.forEach(pt => {

    const value = pt[layer]?.[medium]?.[type] || 0;

    const canvas = document.createElement("canvas");
    canvas.width = 30;
    canvas.height = 40;

    new Chart(canvas,{
      type:"bar",
      data:{
        labels:[""],
        datasets:[{
          data:[value],
          backgroundColor:"#FF8C00"
        }]
      },
      options:{
        responsive:false,
        plugins:{
          legend:{display:false},
          tooltip:{enabled:false}
        },
        scales:{
          x:{display:false},
          y:{
            beginAtZero:true,
            ticks:{display:false},
            grid:{display:false}
          }
        }
      }
    });

    const icon = L.divIcon({
      html: canvas,
      className:"",
      iconSize:[30,40]
    });

    const marker = L.marker([pt.latitude, pt.longitude],{icon})
      .bindPopup(`
        <b>${pt.station_code}</b><br>
        ${formatKey(type)}: ${value}
      `);

    markers.addLayer(marker);

  });

}

function drawTypeMap(type, layer, medium){

  markers.clearLayers();
  pieMarkers.clearLayers();

  currentPoints.forEach(pt=>{

    const value = pt[layer]?.[medium]?.[type] || 0;

    const marker = L.marker([pt.latitude, pt.longitude])
      .bindPopup(`
        <b>${pt.station_code}</b><br>
        ${formatKey(type)}: ${value}
      `);

    markers.addLayer(marker);

  });

}
document.getElementById("typeSelect")
.addEventListener("change", drawTypeChart);

// ===== MAP LEGEND =====
let mapLegend = null;

function addMapLegend(keys){

  // remove old legend
  if(mapLegend){
    map.removeControl(mapLegend);
  }

  mapLegend = L.control({ position: "bottomleft" });

  mapLegend.onAdd = function(){
    const div = L.DomUtil.create("div", "map-legend");

    div.style.background = "white";
    div.style.padding = "10px";
    div.style.border = "1px solid #ccc";
    div.style.borderRadius = "6px";
    div.style.fontSize = "12px";
    div.style.lineHeight = "18px";

    keys.forEach((k,i)=>{
      div.innerHTML += `
        <div style="display:flex; align-items:center; margin-bottom:4px;">
          <span style="
            width:14px;
            height:14px;
            background:${CHART_COLORS[i]};
            display:inline-block;
            margin-right:6px;
          "></span>
          ${formatKey(k)}
        </div>
      `;
    });

    return div;
  };

  mapLegend.addTo(map);
}


function drawStacked(type, keys){
  const medium = document.getElementById("mediumSelect").value;
  const barCtx = document.getElementById("barCanvas").getContext("2d");
const pieCtx = document.getElementById("pieCanvas").getContext("2d");
  barChart = new Chart(barCtx,{
    type:"bar",
    data:{
      labels: currentPoints.map(p=>p.station_code),
      datasets: keys.map((k, index) => ({
  label: formatKey(k),
  data: currentPoints.map(p =>
    (p[type]?.[medium]?.[k] || 0)
  ),
  borderWidth: 1,
  backgroundColor: CHART_COLORS[index % CHART_COLORS.length] // unique color
}))
    },
    options:{
      responsive:true,
      maintainAspectRatio: false,
      plugins:{
        title:{
          display:true,
          text: `${type.toUpperCase()} (${medium.toUpperCase()})`
        }
      },
      scales:{
        x:{ stacked:true },
        y:{ stacked:true, beginAtZero:true }
      }
    }
  })



  // ===== Pie Chart (Total Distribution) =====
  const totals = {};
  keys.forEach(k => totals[k] = 0);

  currentPoints.forEach(p=>{
    keys.forEach(k=>{
      totals[k] += (p[type]?.[medium]?.[k] || 0);
    });
  });
  pieChart = new Chart(pieCtx,{
    type:"pie",
    data:{
      labels: keys.map(k => formatKey(k)),
      datasets:[{
  data: keys.map(k=>totals[k]),
  backgroundColor: CHART_COLORS.slice(0, keys.length)
}]
    },
    options:{
      responsive:true,
      plugins:{
        title:{
          display:true,
          text:`Total ${type.toUpperCase()} Distribution`
        }
      }
    }
  });
}
// ===== GET ALL ESTUARY DATA =====
async function getAllEstuaryData(){
  const token = localStorage.getItem("access_token");
  const estuaries = ["Palar","Kollidam","Pulicat"];
  let allPoints = [];
  for(const est of estuaries){
    const [abRes, shRes, colRes, szRes] = await Promise.all([
      fetch(`${API_BASE}/estuaries/${est}/abundance`, { headers:{ "Authorization":`Bearer ${token}` }}),
      fetch(`${API_BASE}/estuaries/${est}/shape`,     { headers:{ "Authorization":`Bearer ${token}` }}),
      fetch(`${API_BASE}/estuaries/${est}/color`,     { headers:{ "Authorization":`Bearer ${token}` }}),
      fetch(`${API_BASE}/estuaries/${est}/size`,      { headers:{ "Authorization":`Bearer ${token}` }})
    ]);
    const abundance = abRes.ok ? await abRes.json() : { points: [] };
    const shape     = shRes.ok ? await shRes.json() : { points: [] };
    const color     = colRes.ok ? await colRes.json() : { points: [] };
    const size      = szRes.ok ? await szRes.json() : { points: [] };
    abundance.points.forEach(pt=>{
      const shapePt = shape.points?.find(s=>s.station_code===pt.station_code) || {};
      const colorPt = color.points?.find(s=>s.station_code===pt.station_code) || {};
      const sizePt  = size.points?.find(s=>s.station_code===pt.station_code) || {};
      allPoints.push({
        ...pt,
        estuary: est,
        shape: shapePt,
        color: colorPt,
        size: sizePt
      });
    });
  }
  return allPoints;
}
// ===== HIGHEST VALUES =====
async function showHighest(){
  const allPoints = await getAllEstuaryData();
  if(allPoints.length===0){ alert("No data"); return; }
  // Abundance
  let highestAb = allPoints[0];
  let highestAbValue = (highestAb.water_abundance||0) + (highestAb.sediment_abundance||0);
  allPoints.forEach(p=>{
    const total = (p.water_abundance||0) + (p.sediment_abundance||0);
    if(total > highestAbValue){ highestAbValue=total; highestAb=p; }
  });
  // Color
  let highestColor = {key:null, value:0, station:null, estuary:null};
  allPoints.forEach(p=>{
    ["water","sediment"].forEach(med=>{
      for(const [col,val] of Object.entries(p.color?.[med]||{})){
        if(val>highestColor.value){
          highestColor={ key:col, value:val, station:p.station_code, estuary:p.estuary };
        }
      }
    });
  });
  // Size
  let highestSize = {key:null, value:0, station:null, estuary:null};
  allPoints.forEach(p=>{
    ["water","sediment"].forEach(med=>{
      for(const [sz,val] of Object.entries(p.size?.[med]||{})){
        if(val>highestSize.value){
          highestSize={ key:sz, value:val, station:p.station_code, estuary:p.estuary };
        }
      }
    });
  });
  // Shape
  let highestShape = {key:null, value:0, station:null, estuary:null};
  allPoints.forEach(p=>{
    ["water","sediment"].forEach(med=>{
      for(const [sh,val] of Object.entries(p.shape?.[med]||{})){
        if(val>highestShape.value){
          highestShape={ key:sh, value:val, station:p.station_code, estuary:p.estuary };
        }
      }
    });
  });
  // Display
  document.getElementById("taskResult").innerHTML=`
    <h3>Highest Values Across All Estuaries</h3>
    <b>Abundance:</b> ${highestAbValue} at ${highestAb.station_code} (${highestAb.estuary})<br>
    <b>Color:</b> ${highestColor.key} (${highestColor.value}) at ${highestColor.station} (${highestColor.estuary})<br>
    <b>Size:</b> ${formatKey(highestSize.key)} (${highestSize.value}) at ${highestSize.station} (${highestSize.estuary})<br>
    <b>Shape:</b> ${highestShape.key} (${highestShape.value}) at ${highestShape.station} 
  `;
}

function showStateEstuaries(coast){
  const panel = document.getElementById("dynamicPanel");
  let states = coast==='west' ? ["Gujarat","Maharashtra","Goa","Karnataka","Kerala"] : ["West Bengal","Odisha","Andhra Pradesh","Tamil Nadu"];
  panel.innerHTML = states.map(st=>`<button onclick="showStateRanks('${st}')">${st}</button>`).join("<br>");

async function showStateRanks(state){
  const panel = document.getElementById("dynamicPanel");
  panel.innerHTML = "Loading ranks...";

  const allPoints = await getAllEstuaryData();
  const statePoints = allPoints.filter(p => p.state === state);

  if(statePoints.length === 0){
    panel.innerHTML = `No data available for ${state}`;
    return;
  }

  const mediums = ["sediment","water"];
  const layers  = ["abundance","color","shape","size"];

  let html = `<h3>Ranks for ${state}</h3>`;

  for(const med of mediums){
    html += `<h4>${med.charAt(0).toUpperCase() + med.slice(1)}</h4>`;

    // ===== Abundance Table =====
    const abUnit = med === "sediment" ? "Abundance (per 50 g)" : "Abundance (per cubic meter)";
    html += `<table border="1" cellpadding="6" cellspacing="0">
       <tr><th>Station</th><th>Estuary</th><th>${abUnit}</th></tr>`;
    


const sortedAb = statePoints.slice().sort((a,b) => 
      ((b[`${med}_abundance`]||0) - (a[`${med}_abundance`]||0))
    );
    sortedAb.forEach(p=>{
      html += `<tr>
        <td>${p.station_code}</td>
        <td>${p.estuary}</td>
        <td>${p[`${med}_abundance`] || 0}</td>
      </tr>`;
    });
    html += `</table><br>`;

    // ===== Color Table =====
    html += `<table border="1" cellpadding="6" cellspacing="0">
      <tr><th>Color</th><th>Total Count</th></tr>`;
    const colorSum = {};
    statePoints.forEach(p=>{
      const colors = p.color?.[med] || {};
      for(const [k,v] of Object.entries(colors)){
        colorSum[k] = (colorSum[k]||0) + v;
      }
    });
    Object.entries(colorSum).sort((a,b)=>b[1]-a[1])
      .forEach(([k,v])=>{
        html += `<tr><td>${k}</td><td>${v}</td></tr>`;
      });
    html += `</table><br>`;

    // ===== Shape Table =====
    html += `<table border="1" cellpadding="6" cellspacing="0">
      <tr><th>Shape</th><th>Total Count</th></tr>`;
    const shapeSum = {};
    statePoints.forEach(p=>{
      const shapes = p.shape?.[med] || {};
      for(const [k,v] of Object.entries(shapes)){
        shapeSum[k] = (shapeSum[k]||0) + v;
      }
    });
    Object.entries(shapeSum).sort((a,b)=>b[1]-a[1])
      .forEach(([k,v])=>{
        html += `<tr><td>${formatKey(k)}</td><td>${v}</td></tr>`;
      });
    html += `</table><br>`;

    // ===== Size Table =====
    html += `<table border="1" cellpadding="6" cellspacing="0">
      <tr><th>Size</th><th>Total Count</th></tr>`;
    const sizeSum = {};
    statePoints.forEach(p=>{
      const sizes = p.size?.[med] || {};
      for(const [k,v] of Object.entries(sizes)){
        sizeSum[k] = (sizeSum[k]||0) + v;
      }
    });
    Object.entries(sizeSum).sort((a,b)=>b[1]-a[1])
      .forEach(([k,v])=>{
        html += `<tr><td>${formatKey(k)}</td><td>${v}</td></tr>`;
      });
    html += `</table><br>`;
  }

  panel.innerHTML = html;
}

// Ranks by Estuary
async function showEstuaryRanks(estuary) {
  const panel = document.getElementById("dynamicPanel");
  panel.innerHTML = "Loading ranks...";

  const allPoints = await getAllEstuaryData();
  const estuaryPoints = allPoints.filter(p => p.estuary === estuary);

  if (estuaryPoints.length === 0) {
    panel.innerHTML = `No data available for ${estuary}`;
    return;
  }

  const mediums = ["sediment","water"];
  const layers  = ["abundance","color","shape","size"];
  
  let html = `<h3>Ranks for ${estuary}</h3>`;

  mediums.forEach(med => {
    html += `<h4>${med.charAt(0).toUpperCase() + med.slice(1)}</h4>`;

    // ABUNDANCE
    html += `<b>Abundance:</b><br>`;

    const sortedAb = estuaryPoints.slice().sort((a,b)=> (b[`${med}_abundance`]||0) - (a[`${med}_abundance`]||0));
    html += `<table border="1" cellpadding="5" style="border-collapse:collapse; margin-bottom:10px;">
      <tr><th>Rank</th><th>Station</th><th>Value</th></tr>
      ${sortedAb.map((p,i)=>`<tr><td>${i+1}</td><td>${p.station_code}</td><td>${p[`${med}_abundance`]}</td></tr>`).join("")}
    </table>`;

    // COLOR
    html += `<b>Color:</b><br>`;
    const colorSum = {};
    estuaryPoints.forEach(p => {
      const colors = p.color?.[med] || {};
      for(const [k,v] of Object.entries(colors)){
        colorSum[k] = (colorSum[k] || 0) + v;
      }
    });
    const sortedColor = Object.entries(colorSum).sort((a,b)=> b[1]-a[1]);
    html += `<table border="1" cellpadding="5" style="border-collapse:collapse; margin-bottom:10px;">
      <tr><th>Rank</th><th>Color</th><th>Total</th></tr>
      ${sortedColor.map(([k,v],i)=>`<tr><td>${i+1}</td><td>${k}</td><td>${v}</td></tr>`).join("")}
    </table>`;

    // SHAPE
    html += `<b>Shape:</b><br>`;
    const shapeSum = {};
    estuaryPoints.forEach(p=>{
      const shapes = p.shape?.[med] || {};
      for(const [k,v] of Object.entries(shapes)){
        shapeSum[k] = (shapeSum[k]||0) + v;
      }
    });
    const sortedShape = Object.entries(shapeSum).sort((a,b)=>b[1]-a[1]);
    html += `<table border="1" cellpadding="5" style="border-collapse:collapse; margin-bottom:10px;">
      <tr><th>Rank</th><th>Shape</th><th>Total</th></tr>
      ${sortedShape.map(([k,v],i)=>`<tr><td>${i+1}</td><td>${formatKey(k)}</td><td>${v}</td></tr>`).join("")}
    </table>`;

    // SIZE
    html += `<b>Size:</b><br>`;
    const sizeSum = {};
    estuaryPoints.forEach(p=>{
      const sizes = p.size?.[med] || {};
      for(const [k,v] of Object.entries(sizes)){
        sizeSum[k] = (sizeSum[k]||0) + v;
      }
    });
    const sortedSize = Object.entries(sizeSum).sort((a,b)=>b[1]-a[1]);
    html += `<table border="1" cellpadding="5" style="border-collapse:collapse; margin-bottom:20px;">
      <tr><th>Rank</th><th>Size</th><th>Total</th></tr>
      ${sortedSize.map(([k,v],i)=>`<tr><td>${i+1}</td><td>${formatKey(k)}</td><td>${v}</td></tr>`).join("")}
    </table>`;
  });

  panel.innerHTML = html;
}/* ================= DARK MODE ================= */
