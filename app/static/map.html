 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>India Estuary Microplastic Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family: Arial, sans-serif; }


#aboutSection {
  padding: 20px;
  background: #f4f4f4;
  font-size: 14px;
}

body.dark-mode #aboutSection {
  background: #1e1e1e;
  color: #e0e0e0;
}

#aboutSection h3 {
  margin-top: 0;
}

#aboutSection h4 {
  margin-bottom: 5px;
  color: #023;
}

body.dark-mode #aboutSection h4 {
  color: #4da6ff;
}

header {
  padding: 10px;
  background: #023;
  color: white;
  position: relative;
}

#controls {
  width: 100%;
  height: auto;
  float: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  padding: 10px 20px;
  background: #eef;
  box-sizing: border-box;
  gap: 20px; /* space between each control group */
}

.control-group {
  display: flex;
  flex-direction: column;
  font-size: 14px;
}

#map {
  margin-left: 0;
  width: 100%;
  height: 80vh; /* map stays visible */
}

.pie-small {
  width: 320px !important;
  height: 320px !important;
  display:block;
  margin:15px auto;
}

.theme-btn {
  position: absolute;
  top: 10px;
  right: 20px;

  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: white;
}

.theme-btn:hover {
  opacity: 0.8;
}

.chart-box {
  display: none;
  padding: 20px;
}


/* DARK MODE */
body.dark-mode { background:#121212; color:#e0e0e0; }
body.dark-mode header { background:#000; }
body.dark-mode #controls { background:#1e1e1e; color:#e0e0e0; }
body.dark-mode #legend { background:#1e1e1e; color:#e0e0e0; border:1px solid #444; }
body.dark-mode .chart-box { background:#181818; }
</style>
</head>

<body>

<header style="position: relative; background:#023; color:white; padding: 20px 0;">
  <!-- Title centered -->
  <h2 style="margin:0; text-align:center;">India Estuary Microplastic Viewer</h2>

  <!-- About Us link bottom-left under the title -->
  <a href="about.html" 
     style="position:absolute; left:20px; top:40px; color:white; text-decoration:none; font-size:14px;">
    About Us
  </a>

  <!-- Theme toggle button top-right -->
  <button id="themeToggle" class="theme-btn" style="position:absolute; top:10px; right:20px;">🌙</button>
</header>




<div id="controls">

  <div class="control-group">
    <label><b>Select Estuary:</b></label>
    <select id="estuarySelect">
      <option value="">-- Choose --</option>
      <option value="Palar">Palar</option>
      <option value="Kollidam">Kollidam</option>
      <option value="Pulicat">Pulicat</option>
    </select>
  </div>

<div class="control-group">
  <label><b>Select Layer:</b></label>
  <select id="layerSelect">
    <option value="">-- Choose --</option>
    <option value="abundance">Abundance</option>
    <option value="shape">Shape</option>
    <option value="color">Color</option>
    <option value="size">Size</option>
  </select>
</div>


  <div class="control-group">
  <label><b>Select Medium:</b></label>
  <select id="mediumSelect">
    <option value="">-- Choose --</option>
    <option value="water">Water</option>
    <option value="sediment">Sediment</option>
  </select>
</div>


  


</div>



<div id="map"></div>


<div class="chart-box" id="abundanceCharts">
<canvas id="waterAbundanceCanvas"></canvas>
<canvas id="sedimentAbundanceCanvas"></canvas>
<hr>
<canvas id="waterAbundancePieCanvas" class="pie-small"></canvas>
<canvas id="sedimentAbundancePieCanvas" class="pie-small"></canvas>
</div>

<div class="chart-box" id="shapeCharts">
<canvas id="waterShapeCanvas"></canvas>
<canvas id="sedimentShapeCanvas"></canvas>
<hr>
<canvas id="waterShapePieCanvas" class="pie-small"></canvas>
<canvas id="sedimentShapePieCanvas" class="pie-small"></canvas>
</div>

<div class="chart-box" id="colorCharts">
<canvas id="waterColorCanvas"></canvas>
<canvas id="sedimentColorCanvas"></canvas>
<hr>
<canvas id="waterColorPieCanvas" class="pie-small"></canvas>
<canvas id="sedimentColorPieCanvas" class="pie-small"></canvas>
</div>

<div class="chart-box" id="sizeCharts">
<canvas id="waterSizeCanvas"></canvas>
<canvas id="sedimentSizeCanvas"></canvas>
<hr>
<canvas id="waterSizePieCanvas" class="pie-small"></canvas>
<canvas id="sedimentSizePieCanvas" class="pie-small"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ================= CONSTANTS =================
const SHAPES = ["fiber","fragment","film","foam","pellet"];
const COLORS = ["black","red","blue","yellow","grey","white","green","orange","brown","transparent"];
const SIZES  = ["lt_1mm","mm_1_to_2_5","mm_2_5_to_5"];
const API_BASE = "https://india-estuaries-api.onrender.com";

const COLOR_MAP = {
  black: "rgba(173,216,230,0.8)",   // light blue
  red: "rgba(255,99,132,0.6)",
  blue: "rgba(54,162,235,0.6)",
  yellow: "rgba(255,206,86,0.6)",
  grey: "rgba(120,120,120,0.9)",
  white: "rgba(255,182,193,0.8)",   // light pink
  green: "rgba(75,192,192,0.6)",
  orange: "rgba(255,159,64,0.6)",
  brown: "rgba(165,42,42,0.6)",
  transparent: "rgba(0,0,0,0.25)"
};

function formatSizeLabel(sizeKey){
  switch(sizeKey){
    case "lt_1mm":
      return "Less than 1 mm";
    case "mm_1_to_2_5":
      return "1 mm to 2.5 mm";
    case "mm_2_5_to_5":
      return "2.5 mm to 5 mm";
    default:
      return sizeKey;
  }
}

// ================= MAP =================
const map = L.map("map").setView([12.8, 80.2], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
const markers = L.layerGroup().addTo(map);

// ================= CHART HOLDERS =================
let waterAbChart, sedimentAbChart;
let waterColorChart, sedimentColorChart;
let waterShapeChart, sedimentShapeChart;
let waterSizeChart, sedimentSizeChart;


let waterAbundancePieChart, sedimentAbundancePieChart;
let waterShapePieChart, sedimentShapePieChart;
let waterColorPieChart, sedimentColorPieChart;
let waterSizePieChart, sedimentSizePieChart;



// ================= LOAD ESTUARY =================
document.getElementById("estuarySelect").addEventListener("change", loadEstuary);

async function loadEstuary(){
  const estuary = this.value;
  if(!estuary) return;

  markers.clearLayers();
  destroyCharts();

  try{
    const baseData = await fetch(`${API_BASE}/estuaries/${estuary}`).then(r=>r.json());
    const shapeData = await fetch(`${API_BASE}/estuaries/${estuary}/shape`).then(r=>r.json());
    const colorData = await fetch(`${API_BASE}/estuaries/${estuary}/color`).then(r=>r.json());
    const sizeData  = await fetch(`${API_BASE}/estuaries/${estuary}/size`).then(r=>r.json());

    const bounds = [];

    baseData.points.forEach(pt => {
      const shapeInfo = shapeData.points.find(s => s.station_code === pt.station_code);
      const colorInfo = colorData.points.find(c => c.station_code === pt.station_code);
      const sizeInfo  = sizeData.points.find(sz => sz.station_code === pt.station_code);

      // Build popup with full details
      let popup = `<div style="max-height:300px; overflow:auto;">
        <b>Station:</b> ${pt.station_code}<br>
        <b>Water Abundance:</b> ${pt.water_abundance} / m³<br>
        <b>Sediment Abundance:</b> ${pt.sediment_abundance} / 50 g
        <hr><b>Water - Shape (%)</b><br>`;
      SHAPES.forEach(s=> popup += `${s}: ${shapeInfo?.water?.[s] ?? 0}%<br>`);

      popup += "<br><b>Water - Color (count/m³)</b><br>";
      COLORS.forEach(c=> popup += `${c}: ${colorInfo?.water?.[c] ?? 0}<br>`);

      popup += "<br><b>Water - Size (count/m³)</b><br>";
      SIZES.forEach(sz=> 
    popup += `${formatSizeLabel(sz)} : ${sizeInfo?.water?.[sz] ?? 0}<br>`
  );


      popup += "<hr><b>Sediment - Shape (%)</b><br>";
      SHAPES.forEach(s=> popup += `${s}: ${shapeInfo?.sediment?.[s] ?? 0}%<br>`);

      popup += "<br><b>Sediment - Color (count/50g)</b><br>";
      COLORS.forEach(c=> popup += `${c}: ${colorInfo?.sediment?.[c] ?? 0}<br>`);

      popup += "<br><b>Sediment - Size (count/50g)</b><br>";
      SIZES.forEach(sz=> 
  popup += `${formatSizeLabel(sz)} : ${sizeInfo?.sediment?.[sz] ?? 0}<br>`
);


      popup += "</div>";

      markers.addLayer(
        L.marker([pt.latitude, pt.longitude]).bindPopup(popup)
      );

      bounds.push([pt.latitude, pt.longitude]);
    });

    map.fitBounds(bounds);

   drawAbundanceCharts(baseData.points);
   drawColorCharts(colorData.points);
   drawShapeCharts(shapeData.points);
   drawSizeCharts(sizeData.points);

    
   drawAbundancePie(baseData.points);
   drawShapePie(shapeData.points);
   drawColorPie(colorData.points);
   drawSizePie(sizeData.points);

    showLayer();

  }catch(e){
    console.error(e);
    alert("API error — check console");
  }
}

// ================= BAR CHARTS =================



// ================= COLOR =================

function drawColorCharts(points){
  waterColorChart = new Chart(document.getElementById("waterColorCanvas"),{
    type:"bar",
    data:{
      labels:points.map(p=>p.station_code),
      datasets:COLORS.map(c=>({
        label:c,
        data:points.map(p=>p.water?.[c]??0),
        stack:"w",
        backgroundColor: COLOR_MAP[c],
        borderColor: COLOR_MAP[c],
        borderWidth:1
      }))
    },
    options:{scales:{x:{stacked:true},y:{stacked:true}}}
  });

  sedimentColorChart = new Chart(document.getElementById("sedimentColorCanvas"),{
    type:"bar",
    data:{
      labels:points.map(p=>p.station_code),
      datasets:COLORS.map(c=>({
        label:c,
        data:points.map(p=>p.sediment?.[c]??0),
        stack:"s",
        backgroundColor: COLOR_MAP[c],
        borderColor: COLOR_MAP[c],
        borderWidth:1
      }))
    },
    options:{scales:{x:{stacked:true},y:{stacked:true}}}
  });
}







// ================= ABUNDANCE =================


function drawAbundanceCharts(points){
  waterAbChart = new Chart(document.getElementById("waterAbundanceCanvas"),{
    type:"bar",
    data:{labels:points.map(p=>p.station_code),
      datasets:[{label:"Water Abundance (count/m³)",data:points.map(p=>p.water_abundance)}]}
  });
  sedimentAbChart = new Chart(document.getElementById("sedimentAbundanceCanvas"),{
    type:"bar",
    data:{labels:points.map(p=>p.station_code),
      datasets:[{label:"Sediment Abundance (count/50g)",data:points.map(p=>p.sediment_abundance)}]}
  });
} 
 



// ================= SHAPE =================
function drawShapeCharts(points){

  waterShapeChart = new Chart(document.getElementById("waterShapeCanvas"),{
    type:"bar",
    data:{
      labels:points.map(p=>p.station_code),
      datasets:SHAPES.map(s=>({
        label:s,
        data:points.map(p=>p.water?.[s] ?? 0),
        stack:"w"
      }))
    },
    options:{scales:{x:{stacked:true},y:{stacked:true}}}
  });

  sedimentShapeChart = new Chart(document.getElementById("sedimentShapeCanvas"),{
    type:"bar",
    data:{
      labels:points.map(p=>p.station_code),
      datasets:SHAPES.map(s=>({
        label:s,
        data:points.map(p=>p.sediment?.[s] ?? 0),
        stack:"s"
      }))
    },
    options:{scales:{x:{stacked:true},y:{stacked:true}}}
  });

}





// ================= SIZE =================
function drawSizeCharts(points){

  waterSizeChart = new Chart(document.getElementById("waterSizeCanvas"),{
    type:"bar",
    data:{
      labels:points.map(p=>p.station_code),
      datasets:SIZES.map(sz=>({
  label: formatSizeLabel(sz),

        data:points.map(p=>p.water?.[sz] ?? 0),
        stack:"w"
      }))
    },
    options:{scales:{x:{stacked:true},y:{stacked:true}}}
  });

  sedimentSizeChart = new Chart(document.getElementById("sedimentSizeCanvas"),{
    type:"bar",
    data:{
      labels:points.map(p=>p.station_code),
      datasets:SIZES.map(sz=>({
  label: formatSizeLabel(sz),

        data:points.map(p=>p.sediment?.[sz] ?? 0),
        stack:"s"
      }))
    },
    options:{scales:{x:{stacked:true},y:{stacked:true}}}
  });

}






// ================= PIE CHART =================


// ================= ABUNDANCE =================

function drawAbundancePie(points){

  // Water Pie
  if(window.waterAbundancePieChart) window.waterAbundancePieChart.destroy();
  window.waterAbundancePieChart = new Chart(
    document.getElementById("waterAbundancePieCanvas"), {
      type:"pie",
      data:{
        labels: points.map(p => `${p.station_code} (Water)`),
        datasets:[{
          data: points.map(p => p.water_abundance || 0),
          backgroundColor: "#36A2EB"
        }]
      },
      options:{
        responsive:false,
        plugins:{
          legend: { position: 'bottom', labels: { boxWidth: 20, padding: 10 } }
        }
      }
    }
  );

  // Sediment Pie
  if(window.sedimentAbundancePieChart) window.sedimentAbundancePieChart.destroy();
  window.sedimentAbundancePieChart = new Chart(
    document.getElementById("sedimentAbundancePieCanvas"), {
      type:"pie",
      data:{
        labels: points.map(p => `${p.station_code} (Sediment)`),
        datasets:[{
          data: points.map(p => p.sediment_abundance || 0),
          backgroundColor: "#FF6384"
        }]
      },
      options:{
        responsive:false,
        plugins:{
          legend: { position: 'bottom', labels: { boxWidth: 20, padding: 10 } }
        }
      }
    }
  );

}


// ================= COLOR =================


function drawColorPie(points){
  const waterTotals = {}, sedimentTotals = {};
  COLORS.forEach(c=>{ waterTotals[c]=0; sedimentTotals[c]=0; });
  points.forEach(p=>COLORS.forEach(c=>{ waterTotals[c]+=p.water?.[c]||0; sedimentTotals[c]+=p.sediment?.[c]||0; }));

  if(window.waterColorPieChart) window.waterColorPieChart.destroy();
  window.waterColorPieChart = new Chart(document.getElementById("waterColorPieCanvas"), {
    type:"pie",
    data:{ labels: COLORS.map(c=>`${c} (Water)`), datasets:[{ data: COLORS.map(c=>waterTotals[c]), backgroundColor: COLORS.map(c=>COLOR_MAP[c]) }] },
    options:{ responsive:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:20, padding:10 } } } }
  });

  if(window.sedimentColorPieChart) window.sedimentColorPieChart.destroy();
  window.sedimentColorPieChart = new Chart(document.getElementById("sedimentColorPieCanvas"), {
    type:"pie",
    data:{ labels: COLORS.map(c=>`${c} (Sediment)`), datasets:[{ data: COLORS.map(c=>sedimentTotals[c]), backgroundColor: COLORS.map(c=>COLOR_MAP[c]) }] },
    options:{ responsive:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:20, padding:10 } } } }
  });
}



// ================= SHAPE =================

function drawShapePie(points){
  const waterTotals = {}, sedimentTotals = {};
  SHAPES.forEach(s => { waterTotals[s]=0; sedimentTotals[s]=0; });
  points.forEach(p => SHAPES.forEach(s => { waterTotals[s]+=p.water?.[s]||0; sedimentTotals[s]+=p.sediment?.[s]||0; }));

  // Water Pie
  if(window.waterShapePieChart) window.waterShapePieChart.destroy();
  window.waterShapePieChart = new Chart(document.getElementById("waterShapePieCanvas"), {
    type: "pie",
    data:{ labels: SHAPES.map(s=>`${s} (Water)`), datasets:[{data: SHAPES.map(s=>waterTotals[s])}] },
    options:{ responsive:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:20, padding:10 } } } }
  });

  // Sediment Pie
  if(window.sedimentShapePieChart) window.sedimentShapePieChart.destroy();
  window.sedimentShapePieChart = new Chart(document.getElementById("sedimentShapePieCanvas"), {
    type: "pie",
    data:{ labels: SHAPES.map(s=>`${s} (Sediment)`), datasets:[{data: SHAPES.map(s=>sedimentTotals[s])}] },
    options:{ responsive:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:20, padding:10 } } } }
  });
}

// ================= SIZE =================

function drawSizePie(points){
  const waterTotals = {}, sedimentTotals = {};
  SIZES.forEach(sz=>{ waterTotals[sz]=0; sedimentTotals[sz]=0; });
  points.forEach(p=>SIZES.forEach(sz=>{ waterTotals[sz]+=p.water?.[sz]||0; sedimentTotals[sz]+=p.sediment?.[sz]||0; }));

  if(window.waterSizePieChart) window.waterSizePieChart.destroy();
  window.waterSizePieChart = new Chart(document.getElementById("waterSizePieCanvas"), {
    type:"pie",
    data:{ labels:SIZES.map(sz=>`${formatSizeLabel(sz)} (Water)`),
 datasets:[{data:SIZES.map(sz=>waterTotals[sz]), backgroundColor:["#36A2EB","#FFCE56","#FF6384"]}] },
    options:{ responsive:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:20, padding:10 } } } }
  });

  if(window.sedimentSizePieChart) window.sedimentSizePieChart.destroy();
  window.sedimentSizePieChart = new Chart(document.getElementById("sedimentSizePieCanvas"), {
    type:"pie",
    data:{ labels:SIZES.map(sz=>`${formatSizeLabel(sz)} (Sediment)`),
 datasets:[{data:SIZES.map(sz=>sedimentTotals[sz]), backgroundColor:["#36A2EB","#FFCE56","#FF6384"]}] },
    options:{ responsive:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:20, padding:10 } } } }
  });
}

// ================= SHOW LAYER =================

function showLayer(){

  const layerType = document.getElementById("layerSelect").value;
  const mediumType = document.getElementById("mediumSelect").value;

  // Hide all chart boxes
  document.querySelectorAll(".chart-box").forEach(c => c.style.display = "none");

  if(!layerType || !mediumType) return;

  let boxId = layerType + "Charts";
  const box = document.getElementById(boxId);
  box.style.display = "block";

  // Hide all canvases inside that box first
  box.querySelectorAll("canvas").forEach(c => c.style.display = "none");

  if(mediumType === "water"){
    box.querySelectorAll("[id^='water']").forEach(c => c.style.display = "block");
  }

  if(mediumType === "sediment"){
    box.querySelectorAll("[id^='sediment']").forEach(c => c.style.display = "block");
  }
}




// ================= EVENTS =================
document.getElementById("mediumSelect").addEventListener("change", showLayer);
document.getElementById("layerSelect").addEventListener("change", showLayer);
const themeBtn = document.getElementById("themeToggle");

themeBtn.addEventListener("click", function(){
  document.body.classList.toggle("dark-mode");

  if(document.body.classList.contains("dark-mode")){
    this.textContent = "☀️";
  } else {
    this.textContent = "🌙";
  }
});



// ================= DESTROY CHARTS =================
function destroyCharts(){
  [
    waterAbChart,
    sedimentAbChart,
    waterColorChart,
    sedimentColorChart,
    waterShapeChart,
    sedimentShapeChart,
    waterSizeChart,
    sedimentSizeChart,
    waterAbundancePieChart,
    sedimentAbundancePieChart,
    waterShapePieChart,
    sedimentShapePieChart,
    waterColorPieChart,
    sedimentColorPieChart,
    waterSizePieChart,
    sedimentSizePieChart

  ].forEach(c => {
    if(c){
      c.destroy();
    }
  });


}

</script>


</body>
</html>
