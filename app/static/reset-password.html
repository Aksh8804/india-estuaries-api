<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>

  <style>
    body {
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f4f8;
      font-family:Arial;
    }

    .card {
      background:white;
      padding:40px;
      border-radius:10px;
      width:360px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      text-align:center;
    }

    h2 {
      margin-bottom:25px;
    }

    label {
      display:block;
      text-align:left;
      margin-bottom:5px;
      font-size:14px;
      font-weight:bold;
    }

    input {
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:14px;
    }

    button {
      width:100%;
      padding:10px;
      background:#023;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-bottom:15px;
      font-size:14px;
    }

    button:hover {
      background:#035;
    }

    .show-pass {
      display:flex;
      align-items:center;
      gap:6px;
      font-size:13px;
      margin-bottom:12px;
      justify-content:flex-start;
      white-space: nowrap;
    }

    .show-pass label {
      margin:0;
      font-weight:normal;
    }

    #message {
      min-height:20px;
      font-size:14px;
      margin-top:10px;
    }

  </style>

</head>

<body>

<div class="card">
  <h2>Reset Password</h2>

  <!-- New Password -->
  <label for="new_password">New Password</label>
  <input type="password" id="new_password" placeholder="Enter new password">

  <!-- Show Password -->
  <div class="show-pass">
    <input type="checkbox" id="showPassword">
    <label for="showPassword">Show Password</label>
  </div>

  <button onclick="resetPassword()">Reset Password</button>

  <p id="message"></p>
</div>

<script>

const API_BASE = "https://india-estuaries-api.onrender.com";

// Get token from URL
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

// 👁️ Show / Hide password
document.getElementById("showPassword").addEventListener("change", function () {
  const passwordField = document.getElementById("new_password");
  passwordField.type = this.checked ? "text" : "password";
});

// 🔐 Reset Password
async function resetPassword(){

  const new_password = document.getElementById("new_password").value;
  const messageBox = document.getElementById("message");

  if(!new_password){
    messageBox.style.color = "red";
    messageBox.innerText = "Please enter a new password.";
    return;
  }

  messageBox.style.color = "black";
  messageBox.innerText = "Resetting password...";

  try {
    const response = await fetch(`${API_BASE}/reset-password`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token, new_password})
    });

    const data = await response.json();

    if(response.ok){
      messageBox.style.color = "green";
      messageBox.innerText = "Password reset successful!";
      setTimeout(()=>window.location.href="/static/login.html",2000);
    } else {
      messageBox.style.color = "red";
      messageBox.innerText = data.detail || "Reset failed.";
    }

  } catch (err) {
    messageBox.style.color = "red";
    messageBox.innerText = "Server error. Try again.";
  }
}

</script>

</body>
</html>
