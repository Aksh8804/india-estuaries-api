<!DOCTYPE html>
<html>
<head>
  <title>Resend Verification</title>

  <style>
    body {
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f4f8;
      font-family:Arial;
    }

    .card {
      background:white;
      padding:40px;
      border-radius:10px;
      width:360px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      text-align:center;
    }

    h2 {
      margin-bottom:25px;
    }

    label {
      display:block;
      text-align:left;
      margin-bottom:5px;
      font-size:14px;
      font-weight:bold;
    }

    input {
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:14px;
    }

    button {
      width:100%;
      padding:10px;
      background:#023;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-bottom:15px;
      font-size:14px;
    }

    button:hover {
      background:#035;
    }

    #message {
      min-height:20px;
      font-size:14px;
      margin-top:10px;
    }

    .link {
      margin-top:15px;
      font-size:14px;
    }

    .link a {
      color:#023;
      text-decoration:none;
    }

    .link a:hover {
      text-decoration:underline;
    }

  </style>

</head>

<body>

<div class="card">
  <h2>Resend Verification Email</h2>

  <!-- Email -->
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Enter your email">

  <button onclick="resend()" id="resendBtn">Resend</button>

  <p id="message"></p>

  <div class="link">
    <a href="/static/login.html">Back to Login</a>
  </div>
</div>

<script>

const API_BASE = "https://india-estuaries-api.onrender.com";

async function resend(){

  const email = document.getElementById("email").value.trim();
  const messageBox = document.getElementById("message");
  const btn = document.getElementById("resendBtn");

  if(!email){
    messageBox.style.color = "red";
    messageBox.innerText = "Please enter your email.";
    return;
  }

  messageBox.style.color = "black";
  messageBox.innerText = "Sending verification email...";
  btn.disabled = true;
  btn.innerText = "Sending...";

  try {
    const response = await fetch(`${API_BASE}/resend-verification-email`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email})
    });

    const data = await response.json();

    if(response.ok){
      messageBox.style.color = "green";
      messageBox.innerText = data.message || "Verification email sent!";
    } else {
      messageBox.style.color = "red";
      messageBox.innerText = data.detail || "Failed to send email.";
    }

  } catch (err) {
    messageBox.style.color = "red";
    messageBox.innerText = "Server error. Try again.";
  }

  btn.disabled = false;
  btn.innerText = "Resend";
}

</script>

</body>
</html>
