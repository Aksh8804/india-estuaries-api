<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>

  <style>
    body {
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f4f8;
      font-family:Arial;
    }

    .card {
      background:white;
      padding:40px;
      border-radius:10px;
      width:360px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      text-align:center;
    }

    h2 {
      margin-bottom:25px;
    }

    label {
      display:block;
      text-align:left;
      margin-bottom:5px;
      font-size:14px;
      font-weight:bold;
    }

    input {
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:14px;
    }

    button {
      width:100%;
      padding:10px;
      background:#023;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-bottom:15px;
      font-size:14px;
    }

    button:hover {
      background:#035;
    }

    #message {
      min-height:20px;
      font-size:14px;
      margin-top:10px;
    }

    .link {
      margin-top:15px;
      font-size:14px;
    }

    .link a {
      color:#023;
      text-decoration:none;
    }

    .link a:hover {
      text-decoration:underline;
    }

  </style>

</head>

<body>

<div class="card">
  <h2>Forgot Password</h2>

  <!-- Username -->
  <label for="username">Username</label>
  <input type="text" id="username" placeholder="Enter your username">

  <button onclick="forgot()">Send Reset Link</button>

  <p id="message"></p>

  <div class="link">
    <a href="/static/login.html">Back to Login</a>
  </div>
</div>

<script>

const API_BASE = "https://india-estuaries-api.onrender.com";

async function forgot() {

  const username = document.getElementById("username").value.trim();
  const messageBox = document.getElementById("message");

  if (!username) {
    messageBox.style.color = "red";
    messageBox.innerText = "Please enter your username.";
    return;
  }

  messageBox.style.color = "black";
  messageBox.innerText = "Sending reset link...";

  try {
    const response = await fetch(
      `${API_BASE}/forgot-password?username=${encodeURIComponent(username)}`,
      { method: "POST" }
    );

    const data = await response.json();

    if (response.ok) {
      messageBox.style.color = "green";
      messageBox.innerText = data.message || "Reset link sent!";
    } else {
      messageBox.style.color = "red";
      messageBox.innerText = data.detail || "Failed to send reset link.";
    }

  } catch (error) {
    messageBox.style.color = "red";
    messageBox.innerText = "Network Error: " + error.message;
  }
}

</script>

</body>
</html>
