<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
</head>
<body>

<h2>Forgot Password</h2>

<input type="text" id="username" placeholder="Enter username"><br><br>
<button onclick="forgot()">Send Reset Link</button>

<p id="message"></p>

<p style="margin-top:15px; text-align:center;">
  <a href="/static/login.html">← Back to Login</a>
</p>

<script>
const API_BASE = "https://india-estuaries-api.onrender.com";

async function forgot() {
  const username = document.getElementById("username").value.trim();
  const messageBox = document.getElementById("message");

  if (!username) {
    messageBox.style.color = "red";
    messageBox.innerText = "Please enter your username.";
    return;
  }

  messageBox.style.color = "black";
  messageBox.innerText = "Sending reset link...";

  try {
    const response = await fetch(
    `${API_BASE}/forgot-password?username=${encodeURIComponent(username)}`,
    {
      method: "POST"
    }
    );

    const data = await response.json();

    if (response.ok) {
    messageBox.style.color = "green";
    messageBox.innerText = data.message || "Reset link sent!";
    } else {
    messageBox.style.color = "red";
    messageBox.innerText = data.detail || "Failed to send reset link.";
    }

    } catch (error) {
    messageBox.style.color = "red";
    messageBox.innerText = "Network Error: " + error.message;
   }
}
</script>
</body>
</html>
